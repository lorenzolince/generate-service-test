services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: tec_sap_files_db
      MARIADB_USER: tecsapuser
      MARIADB_PASSWORD: Panama2025#.
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb_data:/var/lib/mysql
      
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb #10.30.13.21
      PMA_USER: tecsapuser
      PMA_PASSWORD: Panama2025#.
    ports:
      - "8076:80"
