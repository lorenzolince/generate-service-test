services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: orderflow
      MYSQL_USER: sa
      MYSQL_PASSWORD: 123456
    ports:
      - "6033:3306"
    volumes:
      - ./mysqldata:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
          
  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - '8075:80'
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123456 
