services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: generate_service_test
      MYSQL_USER: sa
      MYSQL_PASSWORD: 123456
    ports:
      - "6033:3306"
    volumes:
      - ./mysqldata:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./generate_service_mysql_test_suite.sql:/docker-entrypoint-initdb.d/01-generate_service_mysql_test_suite.sql:ro
          
  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - '8075:80'
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123456 
