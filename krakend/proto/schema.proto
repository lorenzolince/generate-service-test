message GsSpGetThreeCursorsResponse {
repeated PPersonas pPersonas = 1;
repeated PHijos pHijos = 2;
repeated PDirecciones pDirecciones = 3;
}

message PPersonas {
int32 idPersona = 1;
string nombre = 2;
string apellido = 3;
int32 edad = 4;
string email = 5;
google.type.Date fechaNacimiento = 6;
bool activo = 7;
google.protobuf.Timestamp fechaRegistro = 8;
}

message PHijos {
int32 idHijo = 1;
int32 idPersona = 2;
string nombre = 3;
string apellido = 4;
google.type.Date fechaNacimiento = 5;
}

message PDirecciones {
string tipo = 1;
int32 idReferencia = 2;
string pais = 3;
string ciudad = 4;
string telefono = 5;
}

