static_resources:
  listeners:
    - name: listener_rest
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: grpc_backend }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_response(response_handle)
                            local body_wrapper = response_handle:body()
                            if body_wrapper == nil then
                              return
                            end
                            local body = body_wrapper:getBytes(0, body_wrapper:length())

                            -- Timestamp ISO-8601 con fracción de segundos -> "yyyy-MM-dd HH:mm:ss"
                            body = body:gsub(
                              '"(%d%d%d%d%-%d%d%-%d%d)T(%d%d:%d%d:%d%d)%.%d+Z"',
                              '"%1 %2"'
                            )
                            -- Timestamp ISO-8601 sin fracción de segundos
                            body = body:gsub(
                              '"(%d%d%d%d%-%d%d%-%d%d)T(%d%d:%d%d:%d%d)Z"',
                              '"%1 %2"'
                            )

                            -- Objeto Date {day,month,year} en CUALQUIER orden -> "yyyy-MM-dd"
                            body = body:gsub('{([^{}]-)}', function(inner)
                              local day = inner:match('"day"%s*:%s*(%d+)')
                              local month = inner:match('"month"%s*:%s*(%d+)')
                              local year = inner:match('"year"%s*:%s*(%d+)')
                              if day and month and year then
                                return '"' .. string.format('%04d-%02d-%02d', tonumber(year), tonumber(month), tonumber(day)) .. '"'
                              else
                                return '{' .. inner .. '}'
                              end
                            end)

                            body_wrapper:setBytes(body)
                          end
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: "/etc/envoy/schema.pb"
                      services: ["TestDemoGrpcOracleService"]
                      auto_mapping: true
                      convert_grpc_status: true
                      ignore_unknown_query_parameters: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_backend
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: grpc_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 9090
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }